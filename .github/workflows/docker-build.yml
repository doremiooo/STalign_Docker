# 自动构建并推送到 GitHub Container Registry (GHCR)
#
# 触发: 推送到 main / 打 tag(v*) / 手动 workflow_dispatch
# 产物: ghcr.io/<owner>/<repo>:latest (仅 main 分支) 以及 branch/sha/tag 标签

name: Build and push Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # 手动触发

env:
  REGISTRY: ghcr.io
  # GitHub 仓库名即镜像名(小写)。如仓库名含大写, 改用:
  #   IMAGE_NAME: ${{ github.repository_owner }}/stalign
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write # 写 GHCR 必需

# 同一分支的新提交会取消旧的未完成构建, 避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 启用 QEMU 以支持 arm64 构建。注意: arm64 的 C++ 引擎编译在 QEMU 模拟下较慢。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 只在默认分支(main)上打 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PR 只构建不推送(验证能否构建); push 到 main / tag 时推送
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 多架构: amd64(x86) + arm64(Apple Silicon / ARM 服务器)
          platforms: linux/amd64,linux/arm64
          # GitHub Actions 内置缓存, 重复构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
